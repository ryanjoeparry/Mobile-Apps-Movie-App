<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Favourites</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div *ngIf="favourites.length === 0">
    <p>No favourites yet!</p>
  </div>

  <div *ngFor="let movie of favourites">
    <img src="https://image.tmdb.org/t/p/w500{{ movie.poster_path }}">
    <p>{{ movie.overview }}</p>
    <ion-button (click)="goToDetails(movie)">Details</ion-button>
  </div>

</ion-content>
